<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATS Resume Checker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>📄 ATS Resume Checker</h1>

        <p>Upload your resume and check your ATS compatibility.</p>

        <a href="/chatbot">
            <button>🤖 Open AI Career Assistant</button>
        </a>

        <hr>

        <form id="atsForm">

            <label>Upload Resume (PDF/DOCX)</label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,.docx"
                required
            >

            <label>Paste Job Description</label>

            <textarea
                id="job_description"
                name="job_description"
                placeholder="Paste the job description here..."
                required
            ></textarea>

            <button type="submit">
                Check ATS Score
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
